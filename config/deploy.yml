# Production server: 5.223.44.132 ("moab"). All apps are consolidated onto this
# single Hetzner box. 5.223.48.42, 5.223.51.74 and 5.223.54.207 are DECOMMISSIONED
# — an SSH host-key warning for any of them is expected, not a compromise.

# Kamal 2 — muscriptor (audio→MIDI service)
# Shared moab host. Keep surface small: no extra public metadata, CPU/small model.

service: muscriptor
image: moab/muscriptor

ssh:
  user: root

servers:
  web:
    - 5.223.44.132

# Model load + first-time HF weight download can exceed defaults.
deploy_timeout: 600
drain_timeout: 30

proxy:
  ssl:
    certificate_pem: <%= ENV['CLOUDFLARE_SSL_CERT_PEM'] %>
    private_key_pem: <%= ENV['CLOUDFLARE_SSL_KEY_PEM'] %>
  # Short host keeps the public name quiet (not a marketing page).
  host: ms.moab.jp
  app_port: 8000
  forward_headers: true
  healthcheck:
    path: /health
    interval: 10
    # First start loads the model — allow a slow first probe.
    timeout: 30

registry:
  server: escalante.tailabd61f.ts.net:5555
  username: kamal
  password:
    - KAMAL_REGISTRY_PASSWORD

env:
  secret:
    - CLOUDFLARE_SSL_CERT_PEM
    - CLOUDFLARE_SSL_KEY_PEM
    - HF_TOKEN
  clear:
    # CPU-friendly defaults on the shared host (no GPU).
    MUSCRIPTOR_MODEL: small
    MUSCRIPTOR_DEVICE: cpu
    PORT: "8000"
    HF_HOME: /data/huggingface
    HUGGINGFACE_HUB_CACHE: /data/huggingface/hub
    # Reduce hub chatter in logs
    HF_HUB_DISABLE_TELEMETRY: "1"
    DO_NOT_TRACK: "1"

# Persist HF hub cache (weights) across deploys.
volumes:
  - "muscriptor_hf_cache:/data/huggingface"

# Builds run locally with Docker on this machine. This host is arm64 and the
# servers are amd64, so buildx cross-builds via emulation.
builder:
  arch: amd64
  dockerfile: Dockerfile
  context: .
  provenance: false
  sbom: false

aliases:
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  health: app exec "curl -sf http://127.0.0.1:8000/health"
